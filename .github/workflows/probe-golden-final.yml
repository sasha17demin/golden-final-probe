name: probe-golden-final
on:
  pull_request:
    types: [labeled]
    branches: [main]
permissions:
  statuses: write
jobs:
  post:
    if: github.event.label.name == 'post-golden-final'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" -f state=success -f context=golden-final -f description="GITHUB_TOKEN probe"
